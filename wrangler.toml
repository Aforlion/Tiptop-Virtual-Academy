# wrangler.toml - Cloudflare Pages & Workers Configuration

name = "tiptop-virtual-academy"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

# Build output entry-points for Next-on-Pages / Wrangler deployment
main = ".vercel/output/static/_worker.js"

[assets]
directory = ".vercel/output/static"

# 1. Cloudflare R2 Bucket Binding (Commented out until R2 is enabled in dashboard)
# [[r2_buckets]]
# binding = "TIPTOP_R2"
# bucket_name = "tiptop-academy-portfolios"
# preview_bucket_name = "tiptop-academy-portfolios-preview"

# 2. Cloudflare Queues Binding (Commented out until Queues are enabled in dashboard)
